function ecritureAchat(p){
  var ht=+p.ht||0,tva=+p.tva||0,cpt=p.compte||"6111",isImmo=/^2/.test(cpt);
  var timbre=+p.timbre||0,debours=+p.debours||0,ras=+p.ras||0;
  var tvaNonRecup=!!p.tvaNonRecup;
  var lib=(p.fournisseur||"Fournisseur")+(p.numero?" Fac "+p.numero:"");
  var lignes=[];
  // 1) charge / immobilisation (HT, + TVA si non récupérable)
  var charge=ht+(tvaNonRecup?tva:0);
  lignes.push({compte:cpt,libelle:lib,debit:charge,credit:0});
  // 2) TVA déductible (seulement si récupérable)
  if(tva>0 && !tvaNonRecup)lignes.push({compte:isImmo?"34551":"34552",libelle:"TVA déductible",debit:tva,credit:0});
  // 3) timbre (droit de timbre fiscal) -> charge 61671
  if(timbre>0)lignes.push({compte:"61671",libelle:"Droits de timbre",debit:timbre,credit:0});
  // 4) débours (avances/refacturations hors TVA) -> 61678 (autres) au débit
  if(debours>0)lignes.push({compte:"61678",libelle:"Débours",debit:debours,credit:0});
  // total TTC dû avant retenue
  var ttc=(+p.ttc)|| (ht+tva+timbre+debours);
  // 5) retenue à la source -> crédit État 4458 (à reverser), diminue le net fournisseur
  if(ras>0){
    lignes.push({compte:"4411",libelle:"Frs "+(p.fournisseur||""),debit:0,credit:ttc-ras});
    lignes.push({compte:"4458",libelle:"Retenue à la source à reverser",debit:0,credit:ras});
  }else{
    lignes.push({compte:"4411",libelle:"Frs "+(p.fournisseur||""),debit:0,credit:ttc});
  }
  return {journal:"AC",lignes:lignes};
}
/* ========== MODULE AMORTISSEMENT DES IMMOBILISATIONS (CGNC marocain) ==========
   Plan d'amortissement linéaire avec prorata temporis (30/360) à partir de la date
   de mise en service. Dotation de l'exercice -> écriture OD au 31/12 :
   Débit 619x (dotation, charge) / Crédit 28xx (amortissement cumulé). */
// Catégories : compte CGNC d'immobilisation (classe 2) + taux linéaire usuel au Maroc
var IMMO_CATS=[
  {k:"nonvaleur",   lib:"Frais préliminaires / non-valeurs", cpt:"2111", taux:20},
  {k:"incorporel",  lib:"Brevets, marques, logiciels",       cpt:"2220", taux:20},
  {k:"construction",lib:"Constructions / bâtiments",          cpt:"2321", taux:5},
  {k:"agencement",  lib:"Agencements & aménagements",         cpt:"2356", taux:10},
  {k:"materiel",    lib:"Matériel & outillage",               cpt:"2332", taux:10},
  {k:"transport",   lib:"Matériel de transport",              cpt:"2340", taux:20},
  {k:"mobilier",    lib:"Mobilier de bureau",                 cpt:"2351", taux:10},
  {k:"matbureau",   lib:"Matériel de bureau",                 cpt:"2352", taux:15},
  {k:"matinfo",     lib:"Matériel informatique",              cpt:"2355", taux:20},
  {k:"autre",       lib:"Autre immobilisation",               cpt:"2300", taux:10}
];
function immoCat(k){ return IMMO_CATS.find(function(x){return x.k===k;})||IMMO_CATS[IMMO_CATS.length-1]; }
// Amortissement cumulé (classe 28) déduit du compte d'immo : 2xxx -> 28xxx
function immoAmortCompte(cpt){ cpt=(""+(cpt||"")).replace(/\D/g,""); if(!/^2/.test(cpt))return "28"+cpt; return "28"+cpt.slice(1); }
// Dotation (charge) : 6191 non-valeurs / 6192 incorporelles / 6193 corporelles
function immoDotCompte(cpt){ cpt=(""+(cpt||"")).replace(/\D/g,""); var d2=cpt.charAt(1); if(d2==="1")return "6191"; if(d2==="2")return "6192"; return "6193"; }
function immoDateParts(s){ s=(""+(s||"")).slice(0,10); var m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(m)return {y:+m[1],m:+m[2],d:+m[3]}; return {y:S.year,m:1,d:1}; }
// Tableau d'amortissement linéaire, prorata temporis base 30/360
function immoSchedule(im){
  var base=Math.round((+im.base||0)*100)/100; if(base<=0)return [];
  var taux=+im.taux||0; if(taux<=0)return [];
  var A=base*taux/100;
  var dp=immoDateParts(im.dateAcq);
  var f1=(360-((dp.m-1)*30+(dp.d-1)))/360; if(f1<=0)f1=1; if(f1>1)f1=1;
  var rows=[],cumul=0,y=dp.y,first=true,guard=0;
  while(cumul<base-0.005 && guard++<80){
    var dot=first?A*f1:A;
    if(cumul+dot>base)dot=base-cumul;
    dot=Math.round(dot*100)/100; cumul=Math.round((cumul+dot)*100)/100;
    rows.push({annee:y,dotation:dot,cumul:cumul,vnc:Math.round((base-cumul)*100)/100});
    y++; first=false;
  }
  return rows;
}
function immoDotYear(im,year){ var r=immoSchedule(im).find(function(x){return x.annee===year;}); return r?r.dotation:0; }
function immoCumulYear(im,year){ var c=0; immoSchedule(im).forEach(function(r){if(r.annee<=year)c=r.cumul;}); return c; }
function immoVNCYear(im,year){ var base=Math.round((+im.base||0)*100)/100; return Math.round((base-immoCumulYear(im,year))*100)/100; }

// ----- Formulaire d'ajout / modification -----
function immoDraftDefault(){ var cat=immoCat("matinfo"); return {editId:null,cat:cat.k,libelle:"",compte:cat.cpt,base:"",dateAcq:(S.year+"-01-01"),taux:cat.taux}; }
function immoEnsureDraft(){ if(!S.immoDraft)S.immoDraft=immoDraftDefault(); return S.immoDraft; }
function immoInput(t){
  var d=immoEnsureDraft(),f=t.dataset.imm;
  if(f==="cat"){ var cc=immoCat(t.value); d.cat=cc.k; d.compte=cc.cpt; d.taux=cc.taux; renderView(); return; }
  d[f]=t.value;
}
function immoAdd(){
  var c=clients().find(function(x){return x.id===S.curClient;}); if(!c){showErr("Sélectionnez une société.");return;}
  var d=immoEnsureDraft();
  var lib=(d.libelle||"").trim()||immoCat(d.cat).lib;
  var base=+d.base||0; if(base<=0){showErr("Saisissez la valeur d'acquisition (HT) de l'immobilisation.");return;}
  var taux=+d.taux||0; if(taux<=0){showErr("Saisissez un taux d'amortissement (%) supérieur à 0.");return;}
  var compte=(d.compte||immoCat(d.cat).cpt).trim();
  var g=comptaGet(c.id);
  if(d.editId){ var im=g.immos.find(function(x){return x.id===d.editId;}); if(im){im.libelle=lib;im.cat=d.cat;im.compte=compte;im.base=base;im.dateAcq=d.dateAcq;im.taux=taux;} }
  else { g.immos.push({id:"IMMO"+Date.now()+Math.floor(Math.random()*1000),libelle:lib,cat:d.cat,compte:compte,base:base,dateAcq:d.dateAcq,taux:taux}); }
  save("compta"); S.immoDraft=immoDraftDefault(); renderView();
  showOk(d.editId?"Immobilisation modifiée.":"Immobilisation ajoutée — dotation "+S.year+" calculée automatiquement.");
}

// ----- Comptabilisation des dotations de l'exercice (écriture OD au 31/12) -----
function immoRegId(cid,year){ return "AMORT|"+year+"|"+cid; }
function immoRegIndex(g,id){ for(var i=0;i<g.ecritures.length;i++)if(g.ecritures[i].id===id)return i; return -1; }
function immoRegExists(cid,year){ var g=comptaGet(cid); return immoRegIndex(g,immoRegId(cid,year))>=0; }
function immoPostDotations(){
  var c=clients().find(function(x){return x.id===S.curClient;}); if(!c)return;
  var g=comptaGet(c.id),lignes=[];
  g.immos.forEach(function(im){
    var dot=immoDotYear(im,S.year); if(dot<=0)return;
    lignes.push({compte:immoDotCompte(im.compte),libelle:"DEA "+(im.libelle||""),debit:dot,credit:0});
    lignes.push({compte:immoAmortCompte(im.compte),libelle:"Amort. "+(im.libelle||""),debit:0,credit:dot});
  });
  if(!lignes.length){showErr("Aucune dotation à comptabiliser pour l'exercice "+S.year+".");return;}
  var id=immoRegId(c.id,S.year),ix=immoRegIndex(g,id);
  var ecr={id:id,date:S.year+"-12-31",journal:"OD",piece:"Dotations aux amortissements "+S.year,lignes:lignes,manuel:true,amort:true};
  if(ix>=0)g.ecritures[ix]=ecr; else g.ecritures.push(ecr);
  save("compta"); renderView();
  showOk("Dotations aux amortissements "+S.year+" comptabilisées (journal OD, 31/12). Visibles dans le Journal général.");
}
function immoDelDotations(){
  var g=comptaGet(S.curClient),id=immoRegId(S.curClient,S.year),ix=immoRegIndex(g,id);
  if(ix<0){showErr("Aucune écriture de dotation pour "+S.year+".");return;}
  g.ecritures.splice(ix,1); save("compta"); renderView(); showOk("Écriture de dotations supprimée du journal.");
}

function vCompta(){
  var cs=clients();
  if(S.curClient&&cs.find(function(c){return c.id===S.curClient;})){} else S.curClient=(cs[0]||{}).id||null;
  var c=cs.find(function(x){return x.id===S.curClient;});

// ----- Assistant facture : TTC + compte → HT, TVA et Fournisseur/Client calculés -----
function odAssistDefault(){ return {on:true,sens:"achat",ttc:"",taux:20,compte:"6111",tiers:""}; }
function odEnsureAssist(d){ if(!d.assist)d.assist=Object.assign(odAssistDefault(),{on:!d.editId}); return d.assist; }
function odAssistRebuild(d){
  var a=odEnsureAssist(d);
  var ttc=Math.round((+a.ttc||0)*100)/100;
  var taux=+a.taux||0;
  var ht=taux>0?Math.round((ttc/(1+taux/100))*100)/100:ttc;
  var tva=Math.round((ttc-ht)*100)/100;
  var compte=(a.compte||"").trim();
  var tiers=(a.tiers||"").trim();
  var isImmo=/^2/.test(compte);
  function v(x){ return x?x:""; }
  if(a.sens==="vente"){
    d.journal="VE";
    d.lignes=[{compte:"3421",libelle:tiers||"Client",debit:v(ttc),credit:""},
              {compte:compte||"7111",libelle:tiers||"Vente",debit:"",credit:v(ht)}];
    if(taux>0)d.lignes.push({compte:"4455",libelle:"TVA facturée "+taux+"%",debit:"",credit:v(tva)});
  } else {
    d.journal="AC";
    d.lignes=[{compte:compte||"6111",libelle:tiers||"Achat",debit:v(ht),credit:""}];
    if(taux>0)d.lignes.push({compte:isImmo?"34551":"34552",libelle:"TVA déductible "+taux+"%",debit:v(tva),credit:""});
    d.lignes.push({compte:"4411",libelle:tiers||"Fournisseur",debit:"",credit:v(ttc)});
  }
}

function odBalCaisse(){
  var d=odEnsureDraft();

  d.lignes.forEach(function(l){ if((l.compte||"").trim()!=="5161"){td+=+l.debit||0;tc+=+l.credit||0;} });
  var diff=Math.round((td-tc)*100)/100;
  if(!diff){showErr("Rien à équilibrer : saisissez d'abord les lignes de charge / produit.");return;}
  var ln=d.lignes.find(function(l){return (l.compte||"").trim()==="5161";});
  if(!ln){ ln={compte:"5161",libelle:"Caisse",debit:"",credit:""}; d.lignes.push(ln); }
  if(diff>0){ ln.credit=diff; ln.debit=""; ln.libelle=ln.libelle||"Caisse — sortie espèces"; }
  else { ln.debit=-diff; ln.credit=""; ln.libelle=ln.libelle||"Caisse — entrée espèces"; }
  if(!d.mode)d.mode="Espèces";
  renderView();
}
function odInput(t){

function odRecalc(){
  var d=S.comptaDraft; if(!d)return;

function odSave(){
  var c=clients().find(function(x){return x.id===S.curClient;}); if(!c){showErr("Sélectionnez une société.");return;}
  var d=odEnsureDraft();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||"")){showErr("Date invalide.");return;}
  if((+d.date.slice(0,4))!==S.year){showErr("La date doit être dans l'exercice "+S.year+".");return;}
  var lignes=d.lignes.map(function(l){return {compte:(l.compte||"").trim(),libelle:(l.libelle||"").trim(),debit:Math.round((+l.debit||0)*100)/100,credit:Math.round((+l.credit||0)*100)/100};})
                     .filter(function(l){return l.compte && (l.debit||l.credit);});
  if(lignes.length<2){showErr("Saisissez au moins deux lignes avec un n° de compte et un montant.");return;}
  var bad=lignes.find(function(l){return l.debit&&l.credit;});
  if(bad){showErr("Une même ligne ne peut pas avoir à la fois un débit et un crédit (compte "+bad.compte+").");return;}
  var td=lignes.reduce(function(a,l){return a+l.debit;},0),tc=lignes.reduce(function(a,l){return a+l.credit;},0);
  if(Math.abs(td-tc)>0.005){showErr("Écriture déséquilibrée : débit "+fmtDH2(td)+" ≠ crédit "+fmtDH2(tc)+".");return;}
  var g=comptaGet(c.id);
  if(d.editId){
    var e=g.ecritures.find(function(x){return String(x.id)===String(d.editId);});
    if(e){ e.date=d.date; e.journal=d.journal||"OD"; e.piece=d.piece||""; e.mode=d.mode||""; e.lignes=lignes; e.manuel=true; }
    else { g.ecritures.push({id:"MAN"+Date.now(),date:d.date,journal:d.journal||"OD",piece:d.piece||"",mode:d.mode||"",lignes:lignes,manuel:true}); }
    save("compta"); S.comptaDraft=odDraftDefault(); renderView(); showOk("Écriture manuelle modifiée.");
  } else {
    g.ecritures.push({id:"MAN"+Date.now(),date:d.date,journal:d.journal||"OD",piece:d.piece||"",mode:d.mode||"",lignes:lignes,manuel:true});
    save("compta"); S.comptaDraft=odDraftDefault(); renderView(); showOk("Écriture enregistrée dans le journal "+(d.journal||"OD")+".");
  }
}

function comptaListMatch(p,fl){
  if(fl.statut && p.status!==fl.statut)return false;
  if(fl.q){var hay=(p.fournisseur||"")+" "+(p.numero||"")+" "+(p.ice||"")+" "+(p.name||"");if(!smartMatch(fl.q,hay))return false;}
  if(fl.dmin && (p.date||"")<fl.dmin)return false;
  if(fl.dmax && (p.date||"")>fl.dmax)return false;
  var ttc=+p.ttc||((+p.ht||0)+(+p.tva||0));
  if(fl.mmin!=="" && fl.mmin!=null && ttc<+fl.mmin)return false;
  if(fl.mmax!=="" && fl.mmax!=null && ttc>+fl.mmax)return false;
  return true;
}
function comptaOpMatch(o,fl){
  if(fl.statut && (o.status||"nouveau")!==fl.statut)return false;
  if(fl.q){var hay=(o.libelle||"")+" "+(o.reference||"");if(!smartMatch(fl.q,hay))return false;}
  if(fl.dmin && (o.date||"")<fl.dmin)return false;
  if(fl.dmax && (o.date||"")>fl.dmax)return false;
  var mont=(+o.debit||0)+(+o.credit||0);
  if(fl.mmin!=="" && fl.mmin!=null && mont<+fl.mmin)return false;
  if(fl.mmax!=="" && fl.mmax!=null && mont>+fl.mmax)return false;
  return true;
}

function comptaMoveCancel(){var m=document.getElementById("mvmodal");if(m)m.remove();}
function comptaMoveDo(fromId){
  var dest=document.getElementById("mvdest");if(!dest||!dest.value){showErr("Choisissez une société de destination.");return;}
  var ids=Array.prototype.slice.call(document.querySelectorAll(".mv-chk:checked")).map(function(c){return c.value;});
  if(!ids.length){showErr("Aucune pièce cochée.");return;}
  var gFrom=comptaGet(fromId),gTo=comptaGet(dest.value),moved=0;
  ids.forEach(function(pid){
    var idx=gFrom.pieces.findIndex(function(p){return String(p.id)===String(pid);});
    if(idx<0)return;
    var p=gFrom.pieces[idx];
    // move the piece
    gTo.pieces.push(p);
    // move its écriture if any
    if(p.ecritureId){
      var ei=gFrom.ecritures.findIndex(function(e){return e.id===p.ecritureId;});
      if(ei>=0){ gTo.ecritures.push(gFrom.ecritures[ei]); gFrom.ecritures.splice(ei,1); }
    }
    gFrom.pieces.splice(idx,1);
    moved++;
  });
  comptaAutoPost(gFrom);comptaAutoPost(gTo);
  save("compta");comptaMoveCancel();renderView();
  showOk(moved+" pièce(s) déplacée(s) vers "+esc((clients().find(function(x){return String(x.id)===String(dest.value);})||{}).dossier||"")+".");
}

function comptaDedupDo(cid){
  var g=comptaGet(cid),py=g.pieces.filter(function(p){return pieceYear(p)===S.year;});
  var groups={};
  py.forEach(function(p){ var s=pieceSig(p); (groups[s]=groups[s]||[]).push(p); });
  var toDelete=[];
  Object.keys(groups).forEach(function(s){ var grp=groups[s]; if(grp.length>1){ grp.slice(1).forEach(function(p){toDelete.push(p.id);}); } });
  var delSet={};toDelete.forEach(function(id){delSet[String(id)]=true;});
  // retirer écritures liées
  var ecIds={};
  g.pieces.forEach(function(p){ if(delSet[String(p.id)]&&p.ecritureId)ecIds[p.ecritureId]=true; });
  g.ecritures=g.ecritures.filter(function(e){return !ecIds[e.id];});
  g.pieces=g.pieces.filter(function(p){return !delSet[String(p.id)];});
  save("compta");comptaMoveCancel();renderView();
  showOk(toDelete.length+" copie(s) supprimée(s).");
}

// libellé d'un compte (réutilise les dictionnaires existants : PLAN_COMPTABLE, PLAN_VENTES, COMPTE_LABELS)
function detectCompteLabel(cpt){ return (typeof libCompte!=="undefined"&&libCompte(cpt))||""; }

// société (base dossier) d'un client à partir de son id
function socOf(cid){ return ((S.flags[cid]||{}).societe)||{}; }

/* Cœur de la détection.
   opts = {type:"achat"|"vente", libelle, fournisseur, categorie, objet, soc}
   -> renvoie {compte, label, reason, confidence:"haute"|"moyenne"|"faible"} */
function detectCompte(opts){
  opts=opts||{};
  var type=opts.type||"achat";
  var soc=opts.soc||{};
  var txt=_norm([opts.libelle,opts.fournisseur,opts.categorie,opts.objet].filter(Boolean).join(" "));
  // ---------- VENTE : activité du dossier, sauf indice explicite dans le libellé ----------
  if(type==="vente"){
    if(txt){
      if(/(prestation|service|honoraire|consultation|main d oeuvre|intervention|abonnement)/.test(txt))
        return {compte:"7124",label:detectCompteLabel("7124"),reason:"libellé : prestation de services",confidence:"haute"};
      if(/(export|etranger|hors maroc)/.test(txt))
        return {compte:"7113",label:detectCompteLabel("7113"),reason:"libellé : vente à l'export",confidence:"haute"};
      if(/(marchandise|revente|article)/.test(txt))
        return {compte:"7111",label:detectCompteLabel("7111"),reason:"libellé : vente de marchandises",confidence:"haute"};
    }
    var cv=venteCompteForActivite(soc), si=secteurInfo((soc&&soc.secteur)||"");
    return {compte:cv,label:detectCompteLabel(cv),
      reason:si?("activité du dossier : "+si[1]):"produit par défaut (activité non renseignée)",
      confidence:si?"moyenne":"faible"};
  }
  // ---------- ACHAT : mot-clé du libellé / fournisseur -> compte de charge ou immo ----------
  if(txt){
    for(var i=0;i<CHARGE_KEYWORDS.length;i++){
      var row=CHARGE_KEYWORDS[i];
      for(var k=0;k<row.kw.length;k++){
        var kwn=_norm(row.kw[k]);
        if(kwn && txt.indexOf(kwn)>=0)
          return {compte:row.cpt,label:detectCompteLabel(row.cpt),reason:"mot-clé « "+row.kw[k]+" »",confidence:"haute"};
      }
    }
  }
  // ---------- repli : catégorie OCR puis activité du dossier ----------
  if(/immob/i.test(opts.categorie||""))
    return {compte:"2332",label:detectCompteLabel("2332"),reason:"catégorie OCR : immobilisation",confidence:"moyenne"};
  var sec=(soc&&soc.secteur)||"", fb="6111", why="achat par défaut (marchandises)";
  if(sec==="industrie"||sec==="agro"){ fb="6121"; why="dossier industriel → matières premières"; }
  else if(sec==="btp"){ fb="6121"; why="dossier BTP → matériaux"; }
  else if(sec==="services"||sec==="sante"||sec==="transport"){ fb="6122"; why="dossier de services → fournitures consommables"; }
  return {compte:fb,label:detectCompteLabel(fb),reason:why,confidence:"faible"};
}

/* ===== RÈGLEMENT / MODE DE PAIEMENT DES FACTURES =====
   Mode de paiement saisi sur la facture -> compte de trésorerie + journal (CGNC Maroc).
   Génère une écriture de règlement qui alimente Journal, Grand Livre, Balance,
   et (en régime encaissement) déclenche l'exigibilité de la TVA. */
var REG_MODES=["Espèces","Chèque","Virement","Carte bancaire","Effet"];
function regTreasury(mode,isVente){
  switch(mode){
    case "Espèces":        return {compte:"5161", journal:"CA", lib:"Caisse"};
    case "Chèque":         return {compte:"5141", journal:"BQ", lib:"Banque"};
    case "Virement":       return {compte:"5141", journal:"BQ", lib:"Banque"};
    case "Carte bancaire": return {compte:"5141", journal:"BQ", lib:"Banque"};
    case "Effet":          return isVente?{compte:"3425", journal:"OD", lib:"Clients - effets à recevoir"}
                                          :{compte:"4415", journal:"OD", lib:"Fournisseurs - effets à payer"};
    default:               return {compte:"5141", journal:"BQ", lib:"Banque"};
  }
}
// montant réglé directement sur la pièce (mode de paiement coché « réglée »)
function pieceRegDirect(p){
  if(!p||!p.regle||!p.modeReg)return 0;
  var ttc=+p.ttc||((+p.ht||0)+(+p.tva||0));
  var mt=(p.montantReg!=null&&p.montantReg!=="")?+p.montantReg:ttc;
  return Math.round((mt||0)*100)/100;
}
// date effective du règlement (par défaut la date de facture)
function regDateOf(p){ return p.dateReg||p.date||(S.year+"-01-01"); }
function regYearOf(p){ var d=regDateOf(p); return (d&&/^\d{4}/.test(d))?+d.slice(0,4):S.year; }
function regInPeriod(p,period){ return pieceInPeriod({date:regDateOf(p)},period); }
// écriture de règlement (trésorerie <-> tiers)
function ecritureReglement(p){
  var mt=pieceRegDirect(p); if(!(mt>0))return null;
  var isV=p.type==="vente";
  var tr=regTreasury(p.modeReg,isV);
  var ref=p.refReg?(" "+p.refReg):"";
  var lib=(p.fournisseur||(isV?"Client":"Fournisseur"))+(p.numero?" Fac "+p.numero:"")+" — "+p.modeReg+ref;
  var lignes;
  if(isV){
    // encaissement client : débit trésorerie / crédit 3421
    lignes=[{compte:tr.compte,libelle:lib,debit:mt,credit:0},
            {compte:"3421",libelle:"Clt "+(p.fournisseur||""),debit:0,credit:mt}];
  }else{
    // paiement fournisseur : débit 4411 / crédit trésorerie
    lignes=[{compte:"4411",libelle:"Frs "+(p.fournisseur||""),debit:mt,credit:0},
            {compte:tr.compte,libelle:lib,debit:0,credit:mt}];
  }
  return {journal:tr.journal,lignes:lignes,date:regDateOf(p)};
}
function ecritureVente(p){
  var ht=+p.ht||0,tva=+p.tva||0,ttc=+p.ttc||(ht+tva),cpt=p.compte||"7111";
  var lib=(p.fournisseur||"Client")+(p.numero?" Fac "+p.numero:"");
  var lignes=[{compte:"3421",libelle:"Clt "+(p.fournisseur||""),debit:ttc,credit:0},
              {compte:cpt,libelle:lib,debit:0,credit:ht}];
  if(tva>0)lignes.push({compte:"4455",libelle:"TVA facturée",debit:0,credit:tva});
  return {journal:"VE",lignes:lignes};
}
function ecritureFor(p){ return p.type==="vente"?ecritureVente(p):ecritureAchat(p); }
/* ===== LIAISON AUTOMATIQUE : pièce (facture scannée ou saisie) -> écriture -> Journal / Grand Livre / Balance =====
   Fonction idempotente. Elle reconstruit UNIQUEMENT les écritures issues des pièces (e.pieceId),
   sans jamais toucher aux écritures manuelles (e.manuel), bancaires ni d'emprunt (qui n'ont pas de pieceId).
   À appeler après tout ajout / modification / suppression de pièce : le Journal, le Grand Livre,
   la Balance (et la TVA, qui lit déjà les pièces) reflètent alors la réalité automatiquement. */
var _AP_DONE={}; // dossiers déjà réconciliés pour cette session (évite des sauvegardes répétées)
function comptaAutoPost(g){
  if(!g)return;
  g.pieces=g.pieces||[]; g.ecritures=g.ecritures||[];
  var byId={}; g.pieces.forEach(function(p){ byId[String(p.id)]=p; });
  // 1) Purge des écritures-pièces orphelines (pièce supprimée) ou devenues incomplètes -> cascade de suppression
  g.ecritures=g.ecritures.filter(function(e){
    if(!e.pieceId)return true;                  // garder écritures manuelles / banque / emprunt
    var p=byId[String(e.pieceId)];
    if(!p)return false;                         // pièce supprimée -> écriture supprimée
    if(p.rejected)return false;                 // pièce rejetée -> pas d'écriture
    if(e.regId)return !!(p.regle&&p.modeReg&&pieceRegDirect(p)>0); // règlement : gardé tant que la pièce est réglée
    if(!p.compte||!(+p.ht>0))return false;      // pièce incomplète -> pas d'écriture
    return true;
  });
  // 2) Index des écritures-pièces restantes (facture + règlement, séparés)
  var ecByPiece={},regByPiece={};
  g.ecritures.forEach(function(e){ if(e.pieceId){ if(e.regId)regByPiece[String(e.pieceId)]=e; else ecByPiece[String(e.pieceId)]=e; } });
  // 3) Création ou rafraîchissement d'une écriture par pièce éligible (compte + HT renseignés)
  g.pieces.forEach(function(p){
    if(p.rejected||!p.compte||!(+p.ht>0)){ p.ecritureId=null; return; }
    var ec=ecritureFor(p), ex=ecByPiece[String(p.id)];
    if(ex){
      ex.date=p.date||(S.year+"-01-01");
      ex.journal=ec.journal;
      ex.piece=p.numero||p.name||"";
      ex.lignes=ec.lignes;
      p.ecritureId=ex.id;
    }else{
      var ne={id:"AP_"+p.id, pieceId:p.id, date:p.date||(S.year+"-01-01"), journal:ec.journal, piece:p.numero||p.name||"", lignes:ec.lignes, auto:true};
      g.ecritures.push(ne); ecByPiece[String(p.id)]=ne; p.ecritureId=ne.id;
    }
  });
  // 4) Écriture de règlement (mode de paiement) -> trésorerie. Idempotent, indexée par regByPiece.
  g.pieces.forEach(function(p){
    var ecr=ecritureReglement(p), ex=regByPiece[String(p.id)];
    if(!ecr){ p.regEcritureId=null; return; }
    var pieceLib=(p.numero||p.name||"")+" (règlt)";
    if(ex){
      ex.date=ecr.date; ex.journal=ecr.journal; ex.piece=pieceLib; ex.lignes=ecr.lignes; p.regEcritureId=ex.id;
    }else{
      var nr={id:"REG_"+p.id, pieceId:p.id, regId:true, date:ecr.date, journal:ecr.journal, piece:pieceLib, lignes:ecr.lignes, auto:true};
      g.ecritures.push(nr); regByPiece[String(p.id)]=nr; p.regEcritureId=nr.id;
    }
  });
  // 5) Uniformisation : tous les comptes en 10 chiffres (plan du cabinet)
  comptaNormalizeEcritures(g);
}

function listRowsData(){
  var c=clients().find(function(x){return x.id===S.curClient;});if(!c)return null;
  var type=S.comptaList.type||"achat",g=comptaGet(c.id),fl=S.comptaList;
  var titre=type==="vente"?"Ventes":(type==="banque"?"Relevés bancaires":"Achats");
  var rows=g.pieces.filter(function(p){return (p.type||"achat")===type && pieceYear(p)===S.year && comptaListMatch(p,fl);});
  rows.sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});
  var data=rows.map(function(p){
    var ttc=+p.ttc||((+p.ht||0)+(+p.tva||0)),regle=pieceRegle(p.id,g),reste=Math.round((ttc-regle)*100)/100;
    var st=p.status==="valide"?"Validé":(p.status==="exporte"?"Exporté":"À valider");
    var pay=reste<=0.01&&regle>0?"Soldé":(regle>0?"Partiel":"À régler");
    return {date:p.date||"",tiers:p.fournisseur||"",num:p.numero||"",ht:+p.ht||0,tva:+p.tva||0,ttc:ttc,regle:regle,reste:reste,statut:st,paiement:pay};
  });
  return {c:c,titre:titre,rows:data};
}

/* ============================================================
   À-NOUVEAUX N-1 — Import FEC / grand livre & fusion des comptes tiers

// Détection des comptes tiers — CGNC marocain : clients 342x, fournisseurs 441x
function anDig(c){ return (""+ (c==null?"":c)).replace(/\D/g,""); }
function anIsClient(c){ return /^342/.test(anDig(c)); }
function anIsFourn(c){ return /^441/.test(anDig(c)); }
function anIsTiers(c){ return anIsClient(c)||anIsFourn(c); }
function anIsBilan(c){ var d=anDig(c)[0]; return d>="1"&&d<="5"; }

function anEffCompte(cpt,aux){ cpt=(""+cpt).trim(); var a=anDig(aux); if(a && anIsTiers(cpt) && a.length>=5) return a; return cpt; }
// Racine canonique d'un compte : on enlève les zéros à droite (format plan 10 chiffres -> 4 chiffres significatifs),
// sans jamais descendre sous 4 chiffres (ex. 5161000000->5161, 3455200000->34552, 2340000000->2340, 1117100000->11171).
function anRoot(c){ c=(""+(c==null?"":c)).replace(/\D/g,""); if(!c)return ""; var t=c.replace(/0+$/,""); if(t.length<4) t=c.slice(0,4); return t; }
// Comptes déjà utilisés dans l'exercice N (hors écriture d'à-nouveau)
function anYearAccounts(g){
  var anId="AN_"+S.year, seen={}, out=[];
  (g&&g.ecritures||[]).forEach(function(e){ if(e.id===anId)return; var y=(e.date&&/^\d{4}/.test(e.date))?e.date.slice(0,4):String(S.year); if(y!==String(S.year))return;
    (e.lignes||[]).forEach(function(l){ var cc=(l.compte||"").trim(); if(!cc||seen[cc])return; seen[cc]=1; out.push({c:cc,root:anRoot(cc)}); }); });
  return out;
}
// Code cible canonique : on adopte le code EXACT déjà présent en N (même racine), sinon la racine à 4 chiffres
function anResolveTarget(cp, nAcc){
  cp=(""+(cp==null?"":cp)).replace(/\s/g,""); if(!cp)return cp;
  if(nAcc.some(function(n){return n.c===cp;})) return cp;
  var rt=anRoot(cp), m=nAcc.find(function(n){return n.root===rt;});
  return m?m.c:rt;

function anGet(cid){ var st=anStore(cid); var k=String(S.year); if(!st[k])st[k]={src:"",rows:[],map:{},mode:"tiers",balCompte:"11900000",fileName:"",generatedAt:""}; if(!st[k].balCompte)st[k].balCompte="11900000"; return st[k]; }

// --- Parsing FEC (séparateur | ou tabulation ou ;, en-tête standard DGI/EDI) ---
// Normalise une date FEC (AAAAMMJJ, JJ/MM/AAAA, série Excel) -> AAAA-MM-JJ
function anFmtDate(s){
  if(typeof s==="number"){ if(s>20000&&s<80000){ var d=new Date(Math.round((s-25569)*86400000)); return d.toISOString().slice(0,10); } return ""+s; }

  if(/^\d{8}$/.test(s)) return s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8);

function anParseFEC(text){

  var sep = lines[0].indexOf("|")>-1 ? "|" : (lines[0].indexOf("\t")>-1 ? "\t" : (lines[0].indexOf(";")>-1?";":null));
  if(!sep)return null;
  var hdr=lines[0].split(sep).map(function(x){return x.trim().toLowerCase().replace(/[\s_]/g,"");});
  function col(){ for(var i=0;i<arguments.length;i++){var idx=hdr.indexOf(arguments[i]);if(idx>-1)return idx;} return -1; }

  var iLib=col("comptelib","comptelibelle","intitule","libellecompte","comptelibell");
  var iAux=col("compauxnum","compauxiliaire","comptetiers","auxnum","comptaux");
  var iAuxL=col("compauxlib","compauxlibelle","tierslib","compauxlibell");
  var iDeb=col("debit","montantdebit","mttdebit");
  var iCred=col("credit","montantcredit","mttcredit");
  var iDate=col("ecrituredate","datepiece","dateecriture","piecedate","date");
  var iPiece=col("pieceref","ecriturenum","piecenum","numpiece","numeropiece","reference","numfacture");
  var iElib=col("ecriturelib","libelleecriture","designation");
  var iLet=col("ecriturelet","lettrage","ecriturelettrage","codelettrage","let");

    var lib=iLib>-1?(p[iLib]||"").trim():"";

    var auxLib=iAuxL>-1?(p[iAuxL]||"").trim():"";
    var deb=parseNum(iDeb>-1?p[iDeb]:0), cred=parseNum(iCred>-1?p[iCred]:0);

    var a=agg[eff]||(agg[eff]={c:eff,lib:"",deb:0,cred:0,lines:[]});
    var bestLib = (anIsTiers(eff)&&auxLib) ? auxLib : (lib||auxLib);

    a.deb+=deb; a.cred+=cred;
    if(anIsTiers(eff)) a.lines.push({date:anFmtDate(iDate>-1?p[iDate]:""),piece:(iPiece>-1?(p[iPiece]||"").trim():""),lib:(iElib>-1?(p[iElib]||"").trim():(auxLib||lib)),deb:deb,cred:cred,let:(iLet>-1?(p[iLet]||"").trim():"")});

}

// Aiguillage selon le type de fichier

// ----- Import EXCEL (.xlsx / .xls) via SheetJS -----
function anImportExcel(f){

// ----- Import PDF via pdf.js (extraction de texte + reconstruction des lignes) -----
function anImportPdf(f){
  showOk("Extraction du texte du PDF…");
  anLoadPdfJs().then(function(){
    var rd=new FileReader();
    rd.onload=function(){

        var nLines=((txt||"").match(/^\s*\d{3,}/gm)||[]).length;
        if(!txt || nLines<2){ showErr("Aucun texte exploitable dans ce PDF (probablement scanné/image). Exportez plutôt la balance ou le grand livre en Excel ou CSV."); return; }
        comptaANIngest(txt, f.name);
      }).catch(function(e){ showErr("Extraction PDF impossible : "+(e.message||e)); });
    };
    rd.onerror=function(){ showErr("Lecture du fichier impossible."); };

function anPdfToText(data){
  return window.pdfjsLib.getDocument({data:data}).promise.then(function(pdf){
    var out=[], chain=Promise.resolve();
    for(var pn=1;pn<=pdf.numPages;pn++){ (function(pn){
      chain=chain.then(function(){ return pdf.getPage(pn).then(function(page){ return page.getTextContent().then(function(tc){
        var byY={};
        tc.items.forEach(function(it){ var s=it.str; if(!s||!s.trim())return; var tr=it.transform||[1,0,0,1,0,0]; var y=Math.round(tr[5]); (byY[y]=byY[y]||[]).push({x:tr[4],w:it.width||(s.length*4),s:s}); });
        Object.keys(byY).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){

          if(line.trim())out.push(line);
        });
      }); }); });
    })(pn); }
    return chain.then(function(){ return out.join("\n"); });
  });
}

// Analyse d'une feuille Excel (tableau de lignes) : détecte l'en-tête et les colonnes
function anNormHdr(s){ return (s==null?"":String(s)).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }

    var row=(aoa[i]||[]).map(anNormHdr), sc=0;
    row.forEach(function(h){ if(/compte|comptenum|n compte|numero/.test(h))sc++; if(/debit|credit|solde|montant/.test(h))sc++; if(/intitule|libelle|designation|nom|compte lib/.test(h))sc++; if(/journal|ecriture/.test(h))sc++; });
    if(sc>bestScore){bestScore=sc;hdrIdx=i;}

    function find(re){ for(var j=0;j<H.length;j++) if(re.test(H[j])) return j; return -1; }
    var cCpt=find(/comptenum|^compte general|^compte gen|^numero de compte|^n compte|^compte$|^compte /);
    if(cCpt<0)cCpt=find(/compte/);
    var cAux=find(/auxiliaire|comp aux|compte aux|comptetiers|num tiers/); if(cAux===cCpt)cAux=-1;
    var cLib=find(/intitule|libelle|designation|nom du compte|compte lib/);
    var cSD=find(/solde debiteur|debit.*solde|solde.*debit|^sd$/);
    var cSC=find(/solde crediteur|credit.*solde|solde.*credit|^sc$/);
    var cD=find(/^debit$|montant debit|mouvement debit|mvt debit|total debit/);
    var cC=find(/^credit$|montant credit|mouvement credit|mvt credit|total credit/);
    var cDate=find(/^date$|date ecriture|date piece|ecriture date|date operation|date compt|date facture/);
    var cPiece=find(/piece|reference|n facture|num facture|justificatif|n piece/);
    var cLet=find(/lettrage|^lettre$|^let$|code lettrage/);
    var isFEC=H.some(function(h){return /journal|ecriture num|ecriture date/.test(h);});
    var useSolde=(cSD>-1&&cSC>-1)&&!isFEC;

    var detail = cDate>-1;   // colonne date -> grand livre détaillé (lignes de mouvement)
    if(cCpt>-1 && (dCol>-1||cCol>-1)){
      var agg={};
      for(var r=hdrIdx+1;r<aoa.length;r++){

        var lib=cLib>-1?(row2[cLib]==null?"":String(row2[cLib]).trim()):"";
        var deb=parseNum(dCol>-1?row2[dCol]:0), cred=parseNum(cCol>-1?row2[cCol]:0);
        var eff=anEffCompte(cpt,aux);
        var a=agg[eff]||(agg[eff]={c:eff,lib:"",deb:0,cred:0,lines:[]});
        if(lib&&!a.lib)a.lib=lib; a.deb+=deb; a.cred+=cred;
        if(detail && anIsTiers(eff)) a.lines.push({date:anFmtDate(cDate>-1?row2[cDate]:""),piece:(cPiece>-1?(row2[cPiece]==null?"":String(row2[cPiece]).trim()):""),lib:lib,deb:deb,cred:cred,let:(cLet>-1?(row2[cLet]==null?"":String(row2[cLet]).trim()):"")});
      }
      var rows=Object.keys(agg).map(function(k){var a=agg[k];var s=Math.round((a.deb-a.cred)*100)/100;var r={c:a.c,key:a.c,lib:a.lib,deb:Math.round(a.deb*100)/100,cred:Math.round(a.cred*100)/100,solde:s};if(detail&&anIsTiers(a.c)&&a.lines.length)r._lines=a.lines;return r;});
      if(rows.length){ anStoreRows(rows,"excel",fileName); return; }
    }
  }

  var txt=aoa.map(function(row){return (row||[]).map(function(c){return c==null?"":String(c);}).join("\t");}).join("\n");
  comptaANIngest(txt, fileName);
}

// Stockage commun des lignes importées + suggestions de fusion
// Détermine les factures N-1 NON soldées d'un tiers (lettrage si présent, sinon FIFO règlements<->factures)
function anOpenItems(lines, isClient){
  var hasLet=lines.some(function(l){return l.let;}), items=[];
  if(hasLet){
    lines.forEach(function(l){
      if(l.let) return;                                   // ligne lettrée = soldée
      var mt = isClient ? (l.deb-l.cred) : (l.cred-l.deb);
      if(Math.abs(mt)<0.005) return;
      items.push({date:l.date||"",piece:l.piece||"",lib:l.lib||"",montant:Math.round(mt*100)/100,sens:mt>0?"facture":"avoir"});
    });
  } else {
    var inv=[], pay=0;
    lines.slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"");}).forEach(function(l){
      var f=isClient?l.deb:l.cred, r=isClient?l.cred:l.deb;
      if(f>0.005) inv.push({date:l.date||"",piece:l.piece||"",lib:l.lib||"",reste:f});
      if(r>0.005) pay+=r;
    });
    for(var i=0;i<inv.length&&pay>0.005;i++){ var take=Math.min(inv[i].reste,pay); inv[i].reste=Math.round((inv[i].reste-take)*100)/100; pay=Math.round((pay-take)*100)/100; }
    inv.forEach(function(it){ if(it.reste>0.005) items.push({date:it.date,piece:it.piece,lib:it.lib,montant:it.reste,sens:"facture"}); });
  }
  return items;

// Génération de l'écriture d'à-nouveau au 01/01/N
function comptaANGenerate(cid){
  var g=comptaGet(cid), st=anGet(cid);
  if(!st.rows||!st.rows.length){ showErr("Importez d'abord un FEC ou un grand livre N-1."); return; }
  var nAcc=anYearAccounts(g);
  var carry={};
  st.rows.forEach(function(r){
    var keep = st.mode==="tiers" ? anIsTiers(r.c) : anIsBilan(r.c);
    if(!keep)return;
    // tiers : map explicite si définie, sinon résolution canonique ; non-tiers : résolution canonique (fusion auto par racine / code de N)
    var target = anIsTiers(r.c) ? (st.map[r.key]||anResolveTarget(r.c,nAcc)) : anResolveTarget(r.c,nAcc);
    target=(""+target).replace(/\s/g,""); if(!target)return;
    carry[target]=(carry[target]||0)+r.solde;
  });
  var lignes=[], tDeb=0,tCred=0;
  Object.keys(carry).sort().forEach(function(cp){
    var s=Math.round(carry[cp]*100)/100; if(Math.abs(s)<0.005)return;
    var deb=s>0?s:0, cred=s<0?-s:0; tDeb+=deb; tCred+=cred;
    lignes.push({compte:cp,libelle:"À-nouveau "+S.year+" (report clôture "+(S.year-1)+")",debit:deb||"",credit:cred||""});
  });
  if(!lignes.length){ showErr("Aucun solde à reporter avec les options choisies."); return; }
  var diff=Math.round((tDeb-tCred)*100)/100, balAdded=false;
  if(Math.abs(diff)>=0.01){
    var bc=(st.balCompte||"11900000");
    if(diff>0) lignes.push({compte:bc,libelle:"Équilibrage à-nouveaux (report à nouveau)",debit:"",credit:Math.abs(diff)});
    else       lignes.push({compte:bc,libelle:"Équilibrage à-nouveaux (report à nouveau)",debit:Math.abs(diff),credit:""});
    balAdded=true;
  }
  var id="AN_"+S.year;
  g.ecritures=g.ecritures.filter(function(e){return e.id!==id;});
  g.ecritures.push({id:id, date:S.year+"-01-01", journal:"AN", piece:"À-NOUVEAUX "+S.year, lignes:lignes, manuel:true, an:true});
  comptaNormalizeEcritures(g);
  st.generatedAt=new Date().toISOString(); st.generatedLines=lignes.length; st.balanced=!balAdded;
  save("compta");
  showOk("Écriture d'à-nouveau générée au 01/01/"+S.year+" — "+lignes.length+" lignes"+(balAdded?" (une ligne d'équilibrage sur "+(st.balCompte||"11900000")+" a été ajoutée)":"")+". Consultez le Journal et la Balance.");
  renderView();
}

function libCompte(cp){
  if(COMPTE_LABELS[cp])return COMPTE_LABELS[cp];
  var rt=cgncTrim(cp); if(COMPTE_LABELS[rt])return COMPTE_LABELS[rt];
  var f=(typeof PLAN_COMPTABLE!=="undefined"&&PLAN_COMPTABLE.find(function(a){return a[0]===cp||a[0]===rt;}))||(typeof PLAN_VENTES!=="undefined"&&PLAN_VENTES.find(function(a){return a[0]===cp||a[0]===rt;}));

function comptaBalanceRows(c){

// détecte si une opération bancaire est une commission/frais, et calcule HT + TVA (10%)
var COMM_RX=/(commission|comm\.|frais|agios?|tenue de compte|abonnement|cotisation|carte|change|t[ée]l[ée]compensation|virement|prélèvement bancaire|gestion|relev[ée]|interrogation|sms banking|e-?banking|net ?banking)/i;
function detectCommission(op){
  var lib=(op.libelle||"")+" "+(op.reference||"");

  var montant=+op.debit||0;
  if(montant<=0) return null;
  if(!COMM_RX.test(lib)) return null;
  var taux=10; // taux standard services bancaires Maroc
  var ttcHint=/ttc|t\.t\.c|dont tva|tva incl/i.test(lib);
  var htHint=/\bht\b|h\.t|hors taxe/i.test(lib);
  var isTTC;
  if(ttcHint) isTTC=true;
  else if(htHint) isTTC=false;
  else isTTC=true; // défaut Maroc : commissions affichées TTC sur les relevés
  var ht,tva;
  if(isTTC){ ht=Math.round((montant/(1+taux/100))*100)/100; tva=Math.round((montant-ht)*100)/100; }
  else { ht=montant; tva=Math.round(montant*taux/100*100)/100; }
  return {isCommission:true,mode:isTTC?"TTC":"HT",htComm:ht,tvaComm:tva,tauxComm:taux};
}
function opSig(o){
  var m=Math.round(((+o.debit||0)-(+o.credit||0))*100);

    if(pm!=null) return pm<=1;                             // page 1 => nouvelle ; pages 2,3,4… => suite
    // 2) à défaut : le numéro de facture (présent uniquement sur la 1re page de chaque facture)
    var pn=norm(x.numero), cn=norm(cur.x.numero);
    if(pn && cn) return pn!==cn;                           // n° différent => nouvelle ; même n° => suite
    if(pn && !cn) return true;                             // un n° apparaît alors que le groupe n'en avait pas => nouvelle
    // 3) page SANS numéro propre = page de SUITE de la facture courante.
    //    NE PAS découper sur le tiers ni le total : sur une page de suite isolée, l'OCR
    //    renvoie souvent un tiers parasite (le nom du dossier) et/ou le total final.
    //    Le numéro de facture (étape 2) reste le seul signal de découpage fiable.
    return false;
  }
  // complète l'en-tête du groupe avec TOUT champ trouvé sur les pages suivantes
  // (n°, client/fournisseur ou total apparaissant sur une page ultérieure).
  function fillMissing(h,x){
    for(var k in x){ if(Object.prototype.hasOwnProperty.call(x,k) && (h[k]==null||h[k]==="") && x[k]!=null && x[k]!=="") h[k]=x[k]; }
  }
  var _trace=[];   // diagnostic : ce que l'OCR a lu page par page
  var _yr={};      // répartition par exercice (selon la date de chaque facture)

  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(f.size>52428800){tooBig++;continue;}
    var isPdf=/\.pdf$/i.test(f.name)||f.type==="application/pdf";
    var safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_"),baseStamp=Date.now()+"_"+i;
    var srcBytes=null,nbPages=1;
    if(isPdf){
      try{ srcBytes=await f.arrayBuffer(); var PDFLib=await loadPdfLib(); var doc0=await PDFLib.PDFDocument.load(srcBytes,{ignoreEncryption:true}); nbPages=doc0.getPageCount(); }
      catch(e0){ srcBytes=null; nbPages=1; }
    }
    // PDF d'une seule page (ou image) : import standard d'une facture.
    if(!isPdf || nbPages<=1){ await comptaUpload(type,[f]); continue; }

    // 1) Lecture OCR page par page (en mémoire, sans stockage) + détection des frontières.
    var groups=[],cur=null;
    for(var pg=1;pg<=nbPages;pg++){
      if(st)st.textContent="« "+f.name+" » — analyse page "+pg+"/"+nbPages+"…";
      var x={},perr=null;
      try{
        var pb=await extractPdfPages(srcBytes,String(pg));
        if(!pb){ perr="page illisible"; }
        else{
          var b64=await blobToB64(pb);
          var resp=await sb.functions.invoke("extract-facture",{body:{fileBase64:b64,mediaType:"application/pdf",clientNom:c.dossier||"",clientIce:soc.ice||""}});
          if(resp.error)throw resp.error;
          var data=resp.data||{};
          x=(data.factures&&data.factures.length)?data.factures[0]:(data||{});
        }
      }catch(e){ perr=(e.message||e); }
      if(perr)pageErr++;
      var _nw=isNewInvoice(x,cur);
      _trace.push({file:f.name,pg:pg,nb:nbPages,num:(x&&x.numero)||"",tiers:ocrTiers(type,x)||"",ttc:(x&&x.montant_ttc!=null?x.montant_ttc:""),marker:pageMarker(x),nw:_nw,err:perr});
      if(_nw){ cur={start:pg,end:pg,x:Object.assign({},x),err:perr}; groups.push(cur); }
      else { cur.end=pg; fillMissing(cur.x,x); }
    }

    // 2) Une pièce par groupe (= une facture), avec sa plage de pages.
    for(var gi=0;gi<groups.length;gi++){

      var rangeStr=(grp.start===grp.end)?String(grp.start):(grp.start+"-"+grp.end);
      var coversAll=(grp.start===1 && grp.end===nbPages);
      var piecePath="";
      try{
        if(coversAll){
          piecePath=cid+"/compta/"+baseStamp+"_"+safe;
          var upF=await sb.storage.from(DOC_BUCKET).upload(piecePath,f,{upsert:true,contentType:f.type||"application/pdf"});
          if(upF.error)throw upF.error;
        }else{
          var sub=await extractPdfPages(srcBytes,rangeStr);
          if(!sub){ // repli de sécurité : fichier complet
            piecePath=cid+"/compta/"+baseStamp+"_"+safe;
            var upR=await sb.storage.from(DOC_BUCKET).upload(piecePath,f,{upsert:true,contentType:f.type||"application/pdf"});
            if(upR.error)throw upR.error;
          }else{
            piecePath=cid+"/compta/"+baseStamp+"_fac"+(gi+1)+"_p"+rangeStr.replace(/[^0-9]/g,"_")+"_"+safe;
            var upS=await sb.storage.from(DOC_BUCKET).upload(piecePath,sub,{upsert:false,contentType:"application/pdf"});
            if(upS.error)throw upS.error;
          }
        }
      }catch(eU){ piecePath=piecePath||""; }

      var _det=detectCompte({type:type,libelle:(gx.designation||gx.libelle||gx.description||gx.objet||gx.nature||""),fournisseur:gx.fournisseur||"",categorie:gx.categorie||"",soc:soc});
      var nbP=grp.end-grp.start+1;
      var pageLbl=(nbP>1)?("pages "+grp.start+"–"+grp.end):("page "+grp.start);
      var piece={id:Date.now()+"_"+i+"_"+gi,type:type,
        name:f.name+" — facture "+(gi+1)+"/"+groups.length+" ("+pageLbl+")",
        path:piecePath,status:"avalider",
        date:gx.date||"",fournisseur:ocrTiers(type,gx)||"",ice:ocrTiersIce(type,gx)||"",numero:gx.numero||"",
        ht:gx.montant_ht!=null?gx.montant_ht:"",tva:gx.montant_tva!=null?gx.montant_tva:"",ttc:gx.montant_ttc!=null?gx.montant_ttc:"",
        compte:_det.compte,compteAuto:true,compteReason:_det.reason,compteConf:_det.confidence,extracted:gx,pages:""};
      if(grp.err)piece.ocrError=grp.err;
      var hasNum=!!(piece.numero && String(piece.numero).trim());
      var sig=pieceSig(piece);
      if(hasNum && sig && seen[sig]){ piece.dupSuspect=true; dupSkip++; }
      if(hasNum && sig) seen[sig]=true;
      var _py=pieceYear(piece); _yr[_py]=(_yr[_py]||0)+1;
      g.pieces.push(piece);totalFac++;
    }
  }
  comptaAutoPost(g);
  save("compta");setSync("synced");
  var _note=importYearNote(_yr);
  if(st)st.textContent=totalFac+" facture(s) détectée(s)."+_note+(dupSkip?" Dont "+dupSkip+" doublon(s) possible(s).":"")+(pageErr?" "+pageErr+" page(s) illisible(s).":"")+(tooBig?" "+tooBig+" fichier(s) trop volumineux.":"");
  showOk(totalFac+" facture(s) détectée(s) — les pages d'une même facture ont été regroupées automatiquement."+_note);
  if(tooBig)showErr(tooBig+" fichier(s) dépassent 50 Mo et n'ont pas pu être importés.");
  try{ window._lastOcrTrace=_trace; }catch(eD){}
  renderView();
}
// signature d'une facture pour repérer les doublons (n° + TTC + tiers, sinon date + TTC + tiers)
function pieceSig(p){
  var tiers=(p.fournisseur||"").trim().toLowerCase().replace(/\s+/g," ");
  var ttc=Math.round((+p.ttc||((+p.ht||0)+(+p.tva||0)))*100);
  var num=(p.numero||"").trim().toLowerCase().replace(/\s+/g,"");
  var key=num?num:("d:"+(p.date||""));
  return p.type+"|"+key+"|"+ttc+"|"+tiers;
}

function edInput(t){
  var f=t.dataset.ed.split(":"),pid=f[0],field=f[1],cid=String(S.curClient),g=comptaGet(cid);

    var x0=p.extracted||{};
    var det=detectCompte({type:p.type,libelle:(x0.designation||x0.libelle||x0.description||x0.objet||""),fournisseur:p.fournisseur||"",categorie:x0.categorie||"",soc:socOf(S.curClient)});

    var selEl=document.querySelector('[data-ed="'+pid+':compte"]'); if(selEl)selEl.value=p.compte;
  }

  if((field==="ht"||field==="taux") && !p.multiTva){

function banqueValidate(oid){
  var cid=String(S.curClient),g=comptaGet(cid),o=g.operations.find(function(x){return String(x.id)===String(oid);});if(!o)return;

function affSave(oid,montant){

  o.affectations=affs;

  else if(affs.length>1)o.matchLabel=affs.length+" factures";

  if(affs.length) o.status=(o.status==="valide")?"valide":"rapproche";

}

// impression globale : fusionne toutes les factures (PDF) de la société en un seul document, puis ouvre pour impression
async function comptaPrintAll(){
  var cid=String(S.curClient),g=comptaGet(cid);
  var py=g.pieces.filter(function(p){return pieceYear(p)===S.year&&p.path;});
  if(!py.length){showErr("Aucune facture à imprimer pour cette société.");return;}
  var st=document.getElementById("comptastatus");if(st)st.textContent="Préparation de l'impression globale…";
  setSync("saving");
  try{
    var PDFLib=await loadPdfLib();
    var merged=await PDFLib.PDFDocument.create();
    var added=0,skipped=0,paths={};
    for(var i=0;i<py.length;i++){
      var p=py[i];
      if(paths[p.path]){continue;} // éviter de réimprimer 2× le même fichier source
      paths[p.path]=true;
      if(st)st.textContent="Fusion "+(i+1)+"/"+py.length+"…";
      try{
        var url=await comptaSignedUrl(p);
        var resp=await fetch(url); var ab=await resp.arrayBuffer();
        // on ne fusionne que les PDF ; les images sont ignorées dans l'impression groupée
        if(!/\.pdf$/i.test(p.path) && (p.path.indexOf(".pdf")<0)){ skipped++; continue; }
        var src=await PDFLib.PDFDocument.load(ab,{ignoreEncryption:true});
        var idx=src.getPageIndices();
        var pages=await merged.copyPages(src,idx);
        pages.forEach(function(pg){merged.addPage(pg);});
        added++;
      }catch(e){ skipped++; }
    }
    if(!added){ setSync("synced"); if(st)st.textContent=""; showErr("Aucun PDF imprimable (les images ne sont pas fusionnées)."); return; }
    var bytes=await merged.save();
    var blob=new Blob([bytes],{type:"application/pdf"});
    var url2=URL.createObjectURL(blob);
    var w=window.open(url2,"_blank");
    if(w){ try{ w.addEventListener("load",function(){ setTimeout(function(){try{w.print();}catch(e){}},600); }); }catch(e){} }
    setSync("synced");
    if(st)st.textContent=added+" facture(s) fusionnée(s) pour impression."+(skipped?" "+skipped+" ignorée(s).":"");
    showOk(added+" facture(s) prêtes à imprimer.");
  }catch(e){ setSync("synced"); if(st)st.textContent=""; showErr("Impression globale impossible : "+(e.message||e)); }
}

function jurProgress(e){var et=e.etapes||[];var t=et.length,d=et.filter(function(x){return x.done;}).length;return {done:d,total:t,pct:t?Math.round(d/t*100):0};}

function saveJurEntry(cid,eid,patch){var f=findJur(cid,eid);if(!f)return;f.arr[f.i]=Object.assign({},f.e,patch);S.jur[cid]=f.arr.slice();save("jur");}

function numEnLettres(n){
  n=Math.floor(Math.abs(+n||0));if(n===0)return "zéro";
  var u=["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  var d=["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
  function c3(x){var r="";var cent=Math.floor(x/100);var rest=x%100;
    if(cent>0)r+=(cent>1?u[cent]+" ":"")+"cent"+((cent>1&&rest===0)?"s":"");
    if(rest>0){if(r)r+=" ";if(rest<20)r+=u[rest];else{var diz=Math.floor(rest/10),uni=rest%10;
      if(diz===7||diz===9){r+=d[diz]+"-"+u[10+uni];}else{r+=d[diz];if(uni===1&&diz!==8)r+=" et un";else if(uni>0)r+="-"+u[uni];else if(diz===8)r+="s";}}}
    return r;}
  var out="",mil=Math.floor(n/1000),reste=n%1000;
  if(mil>0)out+=(mil>1?c3(mil)+" ":"")+"mille"+(reste?" ":"");
  if(reste>0||n<1000)out+=c3(reste);
  return out.trim();
}

function nextFacNo(){var prefix="FA-"+S.year+"-";var ex=S.factures.filter(function(f){return f.year===S.year;}).map(function(f){return f.num;});var n=ex.length+1;while(ex.indexOf(prefix+("000"+n).slice(-4))>=0)n++;return prefix+("000"+n).slice(-4);}
function facNew(){var c=clients().find(function(x){return x.id===S.curClient;});var f={id:Date.now(),_new:true,num:"",year:S.year,clientId:null,dossier:"",clientICE:"",clientIF:"",clientRC:"",clientAdresse:"",date:new Date().toISOString().slice(0,10),echeance:"",objet:"Honoraires "+S.year,lines:[{designation:"",qte:1,pu:"",taux:20}],timbre:0,timbreAuto:false,mode:"Virement",statut:"emise",comptaPieceId:null,note:""};if(c){f.clientId=c.id;f.dossier=c.dossier;var soc=(S.flags[c.id]||{}).societe||{};f.clientICE=soc.ice||"";f.clientIF=soc.if||"";f.clientRC=soc.rc||"";f.clientAdresse=soc.adresse||soc.siege||"";}return f;}
function facTotals(f){var ht=0,tvaByRate={};(f.lines||[]).forEach(function(l){var q=+l.qte||0,pu=+l.pu||0,taux=+l.taux||0;var lh=q*pu;ht+=lh;tvaByRate[taux]=(tvaByRate[taux]||0)+lh*taux/100;});ht=Math.round(ht*100)/100;var tva=0;Object.keys(tvaByRate).forEach(function(k){tvaByRate[k]=Math.round(tvaByRate[k]*100)/100;tva+=tvaByRate[k];});tva=Math.round(tva*100)/100;var base=Math.round((ht+tva)*100)/100;var timbre=f.timbreAuto?Math.round(base*0.0025*100)/100:(+f.timbre||0);var ttc=Math.round((base+timbre)*100)/100;return {ht:ht,tvaByRate:tvaByRate,tva:tva,timbre:timbre,ttc:ttc};}

/* ===== MODULE DÉLAIS DE PAIEMENT (loi marocaine) ===== */
function delaiFrs(cid,fournisseur){
  var f=((S.flags[cid]||{}).delaisFrs)||{};
  var key=(fournisseur||"").trim().toUpperCase();
  return f[key]!=null?+f[key]:60; // 60 jours par défaut
}
function setDelaiFrs(cid,fournisseur,jours){
  S.flags[cid]=Object.assign({},S.flags[cid]);
  var f=Object.assign({},S.flags[cid].delaisFrs||{});
  var key=(fournisseur||"").trim().toUpperCase();
  if(jours===""||jours==null)delete f[key]; else f[key]=+jours;
  S.flags[cid].delaisFrs=f;save("flags");
}
function addDays(dateStr,days){
  if(!dateStr||!/^\d{4}-\d{2}-\d{2}/.test(dateStr))return "";
  var d=new Date(dateStr+"T00:00:00");d.setDate(d.getDate()+(+days||0));
  return d.toISOString().slice(0,10);
}
// trouve la date de paiement (dernière affectation bancaire) d'une facture
function piecePaiement(pid,g){
  var last=null;
  (g.operations||[]).forEach(function(o){
    (o.affectations||[]).forEach(function(a){
      if(String(a.pieceId)===String(pid)&&o.date){ if(!last||o.date>last.date)last={date:o.date,mode:o.isCommission?"Banque":"Virement/Chèque",ref:o.reference||""}; }
    });
  });
  return last;
}
function delaisRows(cid){
  var g=comptaGet(cid),rows=[];
  g.pieces.filter(function(p){return (p.type==="achat"||!p.type)&&pieceYear(p)===S.year;}).forEach(function(p){
    var ttc=+p.ttc||((+p.ht||0)+(+p.tva||0));
    var delai=(p.delaiPaiement!=null&&p.delaiPaiement!=="")?+p.delaiPaiement:delaiFrs(cid,p.fournisseur);
    var echeance=addDays(p.date,delai);
    var regle=pieceRegle(p.id,g),nonPaye=Math.round((ttc-regle)*100)/100;
    var pay=piecePaiement(p.id,g);
    var dateePaie=pay?pay.date:"";
    // montant payé hors délai : si payé après l'échéance
    var horsDelai=0;
    if(dateePaie&&echeance&&dateePaie>echeance)horsDelai=regle;
    // en retard : échéance dépassée et non soldé
    var enRetard=echeance&&nonPaye>0.01&&echeance<todayISO();
    rows.push({
      id:p.id,tiers:p.fournisseur||"",num:p.numero||"",date:p.date||"",delai:delai,echeance:echeance,
      nature:p.natureMarch||"",dateLivr:p.dateLivraison||"",datePaie:dateePaie,mode:pay?pay.mode:"",ref:pay?pay.ref:"",
      ttc:ttc,nonPaye:nonPaye,horsDelai:horsDelai,
      ice:p.ice||"",if_:p.if_fournisseur||p.if_||"",rc:p.rc||"",adresse:p.adresse||"",
      enRetard:enRetard
    });
  });
  rows.sort(function(a,b){return (a.echeance||"").localeCompare(b.echeance||"");});
  return rows;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function delaisPieceSet(pid,field,val){
  var c=clients().find(function(x){return x.id===S.curClient;});if(!c)return;
  var g=comptaGet(c.id),p=g.pieces.find(function(x){return String(x.id)===String(pid);});if(!p)return;
  p[field]=val;save("compta");
}

/* ===== MODULE EMPRUNTS (tableau d'amortissement → écritures) ===== */
var EMP_CAPITAL="1481";  // Emprunts auprès des établissements de crédit
var EMP_INTERET="6311";  // Intérêts des emprunts et dettes
var EMP_TVA="34552";     // État TVA récupérable sur charges
function empList(cid){ return (S.emprunts[cid]||[]).slice(); }
function empSave(cid,arr){ S.emprunts[cid]=arr; save("emprunts"); }
function empAddMonths(dateStr,n){
  if(!dateStr||!/^\d{4}-\d{2}-\d{2}/.test(dateStr))return "";
  var d=new Date(dateStr+"T00:00:00");d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10);
}
// génère le tableau d'amortissement (mensualité constante) ou retourne les échéances manuelles
function empAmortir(emp){
  if(emp.mode==="manuel") return (emp.echeances||[]).map(function(e,i){
    var cap=+e.capital||0,intr=+e.interet||0,tva=emp.tvaInteret?Math.round(intr*0.10*100)/100:0;
    return {n:i+1,date:e.date||"",capital:cap,interet:intr,tva:tva,total:Math.round((cap+intr+tva)*100)/100,crd:+e.crd||0,valide:!!e.valide,ecritureId:e.ecritureId||null};
  });
  // mode auto : mensualité constante
  var P=+emp.montant||0,taux=(+emp.taux||0)/100,per=emp.periodicite==="trimestrielle"?4:12,n=+emp.duree||0;
  if(P<=0||n<=0) return [];
  var i=taux/per; // taux périodique
  var ech=i>0 ? P*i/(1-Math.pow(1+i,-n)) : P/n; // mensualité
  var rows=[],crd=P,step=emp.periodicite==="trimestrielle"?3:1;
  for(var k=0;k<n;k++){
    var intr=Math.round(crd*i*100)/100;
    var cap=Math.round((ech-intr)*100)/100;
    if(k===n-1){cap=Math.round(crd*100)/100;} // dernière échéance : solde
    var tva=emp.tvaInteret?Math.round(intr*0.10*100)/100:0;
    crd=Math.round((crd-cap)*100)/100;
    var ex=(emp.echeances&&emp.echeances[k])||{};
    rows.push({n:k+1,date:empAddMonths(emp.dateDebut,k*step),capital:cap,interet:intr,tva:tva,total:Math.round((cap+intr+tva)*100)/100,crd:crd<0?0:crd,valide:!!ex.valide,ecritureId:ex.ecritureId||null});
  }
  return rows;
}
function empEcriture(row,emp){
  var lignes=[
    {compte:emp.cptCapital||EMP_CAPITAL,libelle:"Remb. capital "+(emp.organisme||""),debit:row.capital,credit:0},
    {compte:emp.cptInteret||EMP_INTERET,libelle:"Intérêts "+(emp.organisme||""),debit:row.interet,credit:0}
  ];
  if(row.tva>0)lignes.push({compte:emp.cptTva||EMP_TVA,libelle:"TVA/intérêts",debit:row.tva,credit:0});
  lignes.push({compte:BANK_ACCOUNT,libelle:"Échéance "+(emp.organisme||"")+" n°"+row.n,debit:0,credit:row.total});
  return {journal:"BQ",lignes:lignes};
}
function empValiderEcheance(empId,n){
  var cid=String(S.curClient),arr=empList(cid),emp=arr.find(function(e){return String(e.id)===String(empId);});if(!emp)return;
  var rows=empAmortir(emp),row=rows.find(function(r){return r.n===n;});if(!row)return;
  var g=comptaGet(cid),ec=empEcriture(row,emp);
  var ecriture={id:"EMP"+Date.now(),date:row.date||(S.year+"-01-01"),journal:"BQ",piece:"Échéance "+(emp.organisme||"")+" n°"+n,lignes:ec.lignes};
  g.ecritures.push(ecriture);save("compta");
  if(!emp.echeances)emp.echeances=[];
  emp.echeances[n-1]=Object.assign({},emp.echeances[n-1],{valide:true,ecritureId:ecriture.id});
  empSave(cid,arr);renderView();showOk("Échéance n°"+n+" comptabilisée (journal BQ).");
}
function empValiderAnnee(empId){
  var cid=String(S.curClient),arr=empList(cid),emp=arr.find(function(e){return String(e.id)===String(empId);});if(!emp)return;
  var rows=empAmortir(emp),g=comptaGet(cid),ok=0;
  if(!emp.echeances)emp.echeances=[];
  rows.forEach(function(row){
    if(row.valide)return;
    if(row.date&&row.date.slice(0,4)!==String(S.year))return; // uniquement l'exercice courant
    var ec=empEcriture(row,emp);
    var ecriture={id:"EMP"+Date.now()+"_"+row.n,date:row.date||(S.year+"-01-01"),journal:"BQ",piece:"Échéance "+(emp.organisme||"")+" n°"+row.n,lignes:ec.lignes};
    g.ecritures.push(ecriture);
    emp.echeances[row.n-1]=Object.assign({},emp.echeances[row.n-1],{valide:true,ecritureId:ecriture.id});ok++;
  });
  save("compta");empSave(cid,arr);renderView();showOk(ok+" échéance(s) "+S.year+" comptabilisée(s).");
}

function empField(empId,field,val){
  var cid=String(S.curClient),arr=empList(cid),emp=arr.find(function(e){return String(e.id)===String(empId);});if(!emp)return;
  if(field==="tvaInteret")emp[field]=val; else emp[field]=val;

function empEchField(empId,idx,field,val){
  var cid=String(S.curClient),arr=empList(cid),emp=arr.find(function(e){return String(e.id)===String(empId);});if(!emp)return;
  if(!emp.echeances)emp.echeances=[];
  emp.echeances[idx]=Object.assign({},emp.echeances[idx]);emp.echeances[idx][field]=val;
  empSave(cid,arr);

async function empScan(empId,files){
  if(!sb||!session){showErr("Connectez-vous (cloud) pour scanner.");return;}
  files=Array.prototype.slice.call(files||[]);if(!files.length)return;
  var cid=String(S.curClient),arr=empList(cid),emp=arr.find(function(e){return String(e.id)===String(empId);});if(!emp)return;
  var f=files[0];if(f.size>52428800){showErr("Fichier trop volumineux (max 50 Mo).");return;}
  setSync("saving");showOk("Lecture du tableau d'amortissement en cours…");
  try{
    var b64=await blobToB64(f),mt=f.type||(/\.pdf$/i.test(f.name)?"application/pdf":"image/jpeg");
    var resp=await sb.functions.invoke("extract-amortissement",{body:{fileBase64:b64,mediaType:mt}});
    if(resp.error)throw resp.error;
    var data=resp.data||{};
    if(data.error)throw new Error(data.error);
    // remplir l'en-tête (sans écraser ce qui est déjà bien renseigné s'il manque)
    if(data.organisme)emp.organisme=data.organisme;
    if(data.montant)emp.montant=data.montant;
    if(data.taux)emp.taux=data.taux;
    if(data.duree)emp.duree=data.duree;
    if(data.periodicite)emp.periodicite=(data.periodicite==="trimestrielle"?"trimestrielle":"mensuelle");
    // remplacer les échéances et basculer en mode manuel (vraies données banque)
    var ech=Array.isArray(data.echeances)?data.echeances:[];
    emp.echeances=ech.map(function(e){return {date:e.date||"",capital:+e.capital||0,interet:+e.interet||0,crd:+e.crd||0};});
    if(emp.echeances.length)emp.mode="manuel";
    empSave(cid,arr);setSync("synced");renderView();
    if(emp.echeances.length)showOk(emp.echeances.length+" échéance(s) détectée(s) et importée(s).");
    else showErr("Aucune échéance détectée. Vérifiez la qualité du scan ou saisissez manuellement.");
  }catch(e){
    setSync("synced");
    showErr("Lecture impossible : "+(e.message||e)+". Avez-vous bien créé la fonction extract-amortissement ?");
  }
}

/* ===== Filtre de recherche au-dessus des sélecteurs de dossier (taper nom ou initiales) ===== */
function enhanceClientSelects(){
  var sels=document.querySelectorAll('select[id$="client"]');
  Array.prototype.forEach.call(sels,function(sel){
    if(sel.dataset.csearch)return;
    sel.dataset.csearch="1";
    var all=Array.prototype.map.call(sel.options,function(o){return {v:o.value,t:o.textContent};});
    if(all.length<=8)return; // inutile pour une petite liste
    var inp=document.createElement("input");
    inp.type="text";inp.className="ipt";inp.autocomplete="off";
    inp.placeholder="🔎 Taper pour filtrer les dossiers (nom ou initiales)…";
    inp.style.marginBottom="6px";
    sel.parentNode.insertBefore(inp,sel);
    function rebuild(){
      var q=inp.value.trim(),cur=sel.value;
      var list=q?all.filter(function(o){return o.v===""||smartMatch(q,o.t);}):all;
      var vraies=list.filter(function(o){return o.v!=="";});
      sel.innerHTML=(vraies.length?"":'<option value="">— aucun dossier ne correspond —</option>')
        +list.map(function(o){return '<option value="'+esc(o.v)+'">'+esc(o.t)+'</option>';}).join("");
      if(vraies.length){
        if(list.some(function(o){return o.v===cur;}))sel.value=cur;       // garde la sélection si encore visible
        else if(q)sel.value=vraies[0].v;                                   // sinon premier résultat
      }
      sel.style.borderColor=q&&!vraies.length?"#B42318":"";
    }
    inp.addEventListener("input",rebuild);
    inp.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"){
        ev.preventDefault();
        if(sel.value!=="")sel.dispatchEvent(new Event("change",{bubbles:true})); // Entrée = ouvrir le 1er dossier trouvé
      }
    });
  });
}

function submitClient(id){
  const g=i=>document.getElementById(i);
  const dossier=g("cf_dossier").value.trim();
  if(!dossier){g("cf_dossier").focus();return;}
  const data={dossier:dossier,forme:g("cf_forme").value,tel:g("cf_tel").value.trim(),
    honTrim:parseFloat(g("cf_hontrim").value)||0,honBilan:parseFloat(g("cf_honbilan").value)||0,
    pvDepot:parseFloat(g("cf_pv").value)||0,reg:g("cf_reg").value,regTva:(g("cf_regtva")?g("cf_regtva").value:"debit"),
    hasBilan:g("cf_bilan").checked,hasSal:g("cf_sal").checked,hasDp:g("cf_dp").checked,
    hasFoncier:g("cf_foncier").checked,hasCM:g("cf_cm").checked,
    statut:g("cf_statut").value==="—"?"":g("cf_statut").value,comment:g("cf_comment").value.trim()};
  if(id==null){
    const nid=Date.now();S.custom.push(Object.assign({id:nid},data));save("custom");
    delete S.deleted[nid];save("deleted");S.modal={type:"client",id:nid};
  }else{
    S.flags[id]=Object.assign({},S.flags[id],data);save("flags");S.modal={type:"client",id:id};
  }
  render();
}
function submitJur(id){
  const objet=document.getElementById("jf_objet").value.trim();
  if(!objet){document.getElementById("jf_objet").focus();return;}
  const entry={id:Date.now(),type:document.getElementById("jf_type").value,objet:objet,
    echeance:document.getElementById("jf_ech").value,statut:document.getElementById("jf_stat").value,
    observation:document.getElementById("jf_obs").value,
    montant:parseFloat(document.getElementById("jf_montant").value)||0,
    paye:document.getElementById("jf_paye").checked};
  S.jur[id]=(S.jur[id]||[]).concat([entry]);save("jur");
  S.modal=null;S.jurForm=null;render();
}

/* prefixes -> fiche par défaut */
function actFiche(act){
 if(ACT[act])return ACT[act];
 if(/^od_/.test(act))return ACT.od_save;
 if(/^tva/.test(act))return TABS.tva;
 if(/^fac/.test(act))return TABS.fac;
 if(/^sal/.test(act))return TABS.sal;
 if(/^liasse|^annex|^bal|^immo|^prov/.test(act))return TABS.liasse;
 if(/^doc/.test(act))return TABS.docs;
 if(/^jur/.test(act))return TABS.jur;
 if(/^compta/.test(act))return TABS.compta;
 if(/^delais/.test(act))return TABS.delais;
 if(/^emp/.test(act))return TABS.emprunts;
 if(/^ech/.test(act))return TABS.ech;
 if(/^tbl|^tva/.test(act))return TABS.tva;
 return F("Élément du logiciel",
   "Bouton ou action « "+act+" ». Il déclenche une opération dans le module en cours.",
   "Cliquez normalement (Mode Aide désactivé) pour l'utiliser. Reportez-vous à l'aide de l'onglet courant pour le contexte.");
}

/* détecte un n° de compte CGNC dans un texte */
function compteEcriture(txt){
 var m=txt.match(/\b([1-7]\d{3,4})\b/);
 if(!m)return null;
 var c=m[1];
 if(/^7/.test(c))return ECR.vente;
 if(/^2/.test(c))return ECR.immo;
 if(/^34552|^34551|^4455|^4456|^3456/.test(c))return ECR.tva;
 if(/^617|^644|^4432|^4441|^4452|^4443|^4445/.test(c))return ECR.salaire;
 if(/^6136/.test(c))return ECR.honoraire;
 if(/^5141|^4411/.test(c))return ECR.reglFrs;
 if(/^5161/.test(c))return ECR.caisseDep;
 if(/^1481|^631/.test(c))return ECR.emprunt;
 if(/^6701|^4453|^3453/.test(c))return ECR.is;
 if(/^619|^28/.test(c))return ECR.amort;
 if(/^6/.test(c))return ECR.achat;
 return null;
}

/* ---------- résolution : que montrer pour l'élément cliqué ? ---------- */
function resolve(target){
 var el=target;
 // 1) onglet de navigation
 var navBtn=el.closest&&el.closest("[data-tab]");
 if(navBtn&&navBtn.dataset.tab&&TABS[navBtn.dataset.tab])return TABS[navBtn.dataset.tab];
 // 2) badge / texte de statut
 var node=el; var depth=0;
 while(node&&depth<4){
   var txt=(node.textContent||"").toUpperCase();
   if(txt.length<40){
     if(txt.indexOf("DÉPOSÉ")>=0||txt.indexOf("DEPOSE")>=0)return STAT["DÉPOSÉ"];
     if(txt.indexOf("MANQUE")>=0)return STAT["MANQUE DOC"];
     if(txt.indexOf("EN ATTENTE")>=0)return STAT["EN ATTENTE"];
     if(txt.indexOf("NÉANT")>=0||txt.indexOf("NEANT")>=0)return STAT["NÉANT"];
     if(txt.indexOf("EXONÉRÉ")>=0||txt.indexOf("EXONERE")>=0)return STAT["EXONÉRÉ"];
     if(txt.indexOf("SORTANT")>=0)return STAT["SORTANT"];
   }
   node=node.parentElement;depth++;
 }
 // 3) action data-act
 var actEl=el.closest&&el.closest("[data-act]");
 if(actEl&&actEl.dataset.act){
   var f=actFiche(actEl.dataset.act);
   // enrichir l'écriture si la ligne contient un compte précis
   var compteEl=el.closest&&(el.closest("tr")||el.closest(".card"));
   if(!f.ecr&&compteEl){ var e=compteEcriture(compteEl.textContent||""); if(e)f=Object.assign({},f,{ecr:e}); }
   return f;
 }
 // 4) un n° de compte dans la ligne/cellule cliquée
 var rowEl=el.closest&&(el.closest("tr")||el.closest(".rowline")||el.closest(".card"));
 if(rowEl){ var ec=compteEcriture(rowEl.textContent||""); if(ec)return Object.assign({ecr:ec},F("Ligne comptable",
   "Cette ligne correspond à une opération comptable. L'écriture type associée est affichée ci-dessous.",
   "Vérifiez le compte (CGNC), le libellé et le sens (débit/crédit). L'écriture doit toujours être équilibrée.")); }
 // 5) défaut : aide de l'onglet courant
 var tab=(typeof S!=="undefined"&&S.tab)?S.tab:"dash";
 return TABS[tab]||TABS.dash;
}

function buildUI(){
 injectCSS();
 if(document.getElementById("aide-fab"))return;
 var fab=document.createElement("button");
 fab.id="aide-fab";fab.type="button";
 fab.innerHTML='<span style="font-size:16px">🎓</span><span>Mode Aide</span>';
 fab.addEventListener("click",function(ev){ev.stopPropagation();toggle();});
 document.body.appendChild(fab);

 var ov=document.createElement("div");ov.id="aide-overlay";
 ov.addEventListener("click",closePanel);
 document.body.appendChild(ov);

 var p=document.createElement("div");p.id="aide-panel";
 p.innerHTML='<div class="ah"><h3 id="aide-title">Aide</h3><button class="ax" id="aide-close" type="button">×</button></div><div class="ab" id="aide-body"></div>';
 document.body.appendChild(p);
 document.getElementById("aide-close").addEventListener("click",closePanel);
}

function toggle(){
 aideOn=!aideOn;
 var fab=document.getElementById("aide-fab");
 fab.classList.toggle("on",aideOn);
 fab.querySelector("span:last-child").textContent=aideOn?"Aide active":"Mode Aide";
 document.body.classList.toggle("aide-active",aideOn);
 var b=document.getElementById("aide-banner");
 if(aideOn){
   if(!b){b=document.createElement("div");b.id="aide-banner";document.body.appendChild(b);}
   b.innerHTML='🎓 Mode Aide actif — cliquez sur n\'importe quel élément pour voir l\'explication et l\'écriture comptable. (Recliquez « Aide active » pour quitter.)';
 }else{ if(b)b.remove(); closePanel(); }
}

function closePanel(){
 var p=document.getElementById("aide-panel"),o=document.getElementById("aide-overlay");
 if(p)p.classList.remove("open"); if(o)o.classList.remove("open");
}

function openPanel(fiche){
 buildUI();
 document.getElementById("aide-title").textContent=fiche.titre||"Aide";
 var html=''
  +'<div class="sec"><span class="lbl lp">Le problème / ce que c\'est</span><p>'+fiche.probleme+'</p></div>'
  +'<div class="sec"><span class="lbl ls">Comment résoudre</span>'+solutionHtml(fiche.solution)+'</div>';
 if(fiche.ecr)html+='<div class="sec">'+ecrTable(fiche.ecr)+'</div>';
 document.getElementById("aide-body").innerHTML=html;
 document.getElementById("aide-panel").classList.add("open");
 document.getElementById("aide-overlay").classList.add("open");
}

function solutionHtml(sol){
 // si la solution contient « 1) 2) 3) » on en fait une liste numérotée
 if(/\d\)/.test(sol)){
   var parts=sol.split(/(?=\d\))/).map(function(x){return x.replace(/^\d\)\s*/,"").trim();}).filter(Boolean);
   if(parts.length>1)return '<ol>'+parts.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ol>';
 }
 return '<p>'+sol+'</p>';
}

/* ---------- interception des clics (phase capture) ---------- */
document.addEventListener("click",function(e){
 if(!aideOn)return;
 var t=e.target;
 // ne pas intercepter les clics sur l'UI de l'aide elle-même
 if(t.closest&&(t.closest("#aide-fab")||t.closest("#aide-panel")||t.closest("#aide-banner")||t.closest("#aide-overlay")))return;
 e.preventDefault();
 e.stopPropagation();
 try{ openPanel(resolve(t)); }
 catch(err){ openPanel(F("Aide","Impossible d'analyser cet élément.","Désactivez le Mode Aide pour utiliser cette fonction normalement.")); }
},true);

/* ---------- démarrage ---------- */
function init(){ buildUI(); }
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();

})();
